name: Dashboard CI

on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

jobs:
  test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint
        working-directory: dashboard

      - name: Test
        run: npm test
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard
        env:
          # Placeholder values — routes are dynamic and not executed at build time.
          API_URL: http://localhost:8080
          API_KEY: ci-placeholder
